body{margin:0}
a{color:inherit;text-decoration:none}

.press{transition:transform .18s ease,box-shadow .18s ease,background-color .2s ease}
.press:hover{transform:translateY(-1px)}
.press:active{transform:scale(.97)}
.grow{transform-origin:left center;animation:grow 1s cubic-bezier(.2,.8,.2,1) .2s both}

.glow{position:relative;overflow:hidden}
.glow::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(142,224,162,.22),rgba(142,224,162,0) 70%);animation:drift 7s ease-in-out infinite alternate;pointer-events:none}

.thumb{transition:transform .38s cubic-bezier(.3,1.3,.5,1)}
.seglab{transition:color .25s ease}
.chipt{transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .15s ease}
.chipt:active{transform:scale(.95)}
.sheet{animation:sheet .6s cubic-bezier(.2,.8,.2,1) both}

.mapin{animation:mapin 1.2s ease both}
@keyframes mapin{from{transform:scale(1.06);opacity:.6}to{transform:none;opacity:1}}

  const c=C[n], k=c.F||S.lvl||'high', sp=c.SP[k];
  const sel=S.sel[n]||1, ring='2px solid #12403C', flat='1px solid #E3E1DA';
  const r=c.R[sel-1]||c.R[0]||{href:'',label:'',lvl:'high'};
  const set=l=>()=>{S.lvl=l};
  const v={tip:TIP[k](sp,c.W),a:A[k],toHigh:set('high'),toMed:set('med'),toLow:set('low'),go:r.href,goLabel:r.label,goLvl:()=>{S.lvl=r.lvl}};
  [1,2,3].forEach(i=>{v['pick'+i]=()=>{S.sel[n]=i;render(n,true)};v['s'+i]=sel===i;v['pr'+i]=sel===i?'true':'false';v['b'+i]=sel===i?ring:flat});
  if(c.main){
    const names=['Balanced','Fastest','Step-free'],subs=['Speed and walking in balance','Earliest arrival at your event','Lifts and ramps only'];
    [0,1,2].forEach(i=>{v['p'+i]={label:names[i],color:S.pref===i?'#11191B':'#596163',weight:S.pref===i?'700':'500',pressed:S.pref===i?'true':'false',pick:()=>{S.pref=i;render(n,true)}}});
    v.thumbX='translateX('+(S.pref*100)+'%)';v.prefSub=subs[S.pref];
    v.chips=[['train','Train'],['bus','Bus'],['tram','Tram'],['metro','Metro'],['ferry','Ferry']].map(([key,label])=>{const on=!!S.modes[key];
      return {label,pressed:on?'true':'false',bg:on?'#12403C':'#FFFFFF',fg:on?'#FFFFFF':'#596163',bd:on?'#12403C':'#E3E1DA',toggle:()=>{S.modes[key]=!S.modes[key];render(n,true)}}});
  }
  return v;
}
function get(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function fill(h,v,fns){
  h=h.replace(/(on[A-Z]\w*)="\{\{\s*([\w.]+)\s*\}\}"/g,(m,ev,p)=>{fns.push(get(v,p));return 'data-fn="'+(fns.length-1)+'"'});
  return h.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(m,p)=>{const x=get(v,p);return x==null?'':String(x)});
}
function makeScrollable(ph){
  const c=[...ph.querySelectorAll('div')].filter(e=>getComputedStyle(e).overflowY==='hidden'&&parseFloat(getComputedStyle(e).flexGrow)>0&&e.scrollHeight>e.clientHeight+2);
  c.filter(e=>!c.some(o=>o!==e&&o.contains(e))).forEach(e=>e.classList.add('scrollbody'));
}
function render(n,keep){
  if(!T[n]) n='Welcome'; cur=n; const v=vals(n); const fns=[];
  let h=T[n];
  h=h.replace(/<sc-for list="\{\{\s*(\w+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,(m,list,as,inner)=>(v[list]||[]).map(it=>fill(inner,Object.assign({},v,{[as]:it}),fns)).join(''));
  h=h.replace(/<sc-if value="\{\{\s*([\w.]+)\s*\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g,(m,p,inner)=>get(v,p)?inner:'');
  h=fill(h,v,fns);
  const ph=document.getElementById('phone');
  ph.innerHTML=h; makeScrollable(ph); document.title='Transfer Coach · '+C[n].title.replace(/^\S+\s/,'');
  if(keep) ph.querySelectorAll('.rise,.sheet,.mapin,.grow,.draw').forEach(e=>e.style.animation='none');
  ph.querySelectorAll('[data-fn]').forEach(el=>{const f=fns[+el.dataset.fn];el.addEventListener('click',e=>{if(typeof f==='function')f()})});
  ph.querySelectorAll('a[href$=".dc.html"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();setTimeout(()=>{location.hash='#/'+a.getAttribute('href').replace('.dc.html','')},0)}));
}
function route(){const n=(location.hash.replace(/^#\/?/,'')||'Welcome');render(n)}
window.addEventListener('hashchange',route); route();
</script>
